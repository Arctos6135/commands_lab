name: Lab check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Required tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run the lab tests (stretch goals are optional)
        run: |
          chmod +x gradlew
          ./gradlew test -PskipStretch --continue

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lab test results"
            echo
            echo "| Test | Result |"
            echo "|---|---|"
            for f in build/test-results/test/*.xml; do
              [ -f "$f" ] || continue
              cls=$(basename "$f" .xml | sed 's/^TEST-frc\.robot\.//')
              grep -o '<testcase name="[^"]*"[^>]*\(/>\|>\)' "$f" | while read -r line; do
                name=$(echo "$line" | sed 's/.*name="\([^"]*\)".*/\1/')
                case "$line" in
                  */\>) echo "| $cls › $name | ✅ |" ;;
                  *) echo "| $cls › $name | ❌ |" ;;
                esac
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
